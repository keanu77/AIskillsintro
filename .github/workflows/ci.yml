name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PAGES_PROJECT: aiskillsintro
  # Not a secret — visible in every dashboard URL.
  CLOUDFLARE_ACCOUNT_ID: 1b2892015d15c5b88dcf4d819b5d2cea

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E quality gate (axe, overflow, console errors)
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: verify
    # Fork PRs get no secrets, so only deploy PRs from this repository.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      - name: Check Cloudflare token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set — skipping deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick Pages branch
        if: steps.token.outputs.present == 'true'
        id: target
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Derived from the PR number, never the (user-controlled) branch name.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$PR_NUMBER" ]; then
            echo "branch=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "branch=manual-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.token.outputs.present == 'true'
        with:
          name: site
          path: out

      - name: Deploy to Cloudflare Pages
        if: steps.token.outputs.present == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.144.0"
          command: >-
            pages deploy out
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=${{ steps.target.outputs.branch }}
            --commit-hash=${{ github.sha }}
            --commit-dirty=true

      - name: Comment preview URL on PR
        if: steps.token.outputs.present == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = "<!-- pages-preview -->";
            const body = [
              marker,
              `**Cloudflare Pages preview** for ${context.sha.slice(0, 7)}`,
              "",
              `- Preview: ${process.env.ALIAS_URL || process.env.DEPLOY_URL}`,
              `- This deployment: ${process.env.DEPLOY_URL}`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
