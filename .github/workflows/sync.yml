name: Weekly skills refresh

on:
  schedule:
    - cron: "0 1 * * 1" # Mondays 09:00 Asia/Taipei
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        id: install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Refresh sources, discovery and weekly history
        id: refresh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run refresh

      # Runs every check in-workflow too, so the PR body records results even
      # when the PR is opened with GITHUB_TOKEN (which triggers no other workflow).
      - name: Validate and append results to report
        id: verify
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: node scripts/validate-refresh.mjs

      - name: Stage snapshots and detect changes including new files
        id: diff
        if: always() && steps.install.outcome == 'success'
        run: |
          git add -- content src/data/upstream.json src/data/discovery.json src/data/updates.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A PR opened with GITHUB_TOKEN never triggers the required `verify` /
      # `lighthouse` checks. SYNC_PR_TOKEN (fine-grained PAT, this repo only:
      # Contents + Pull requests read/write) opens it as a user so CI runs.
      # Falls back to GITHUB_TOKEN when the secret is not set.
      - name: Open or update weekly review PR
        if: always() && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SYNC_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: bot/upstream-sync
          delete-branch: true
          commit-message: "chore: refresh weekly skills catalog"
          title: "chore: 每週 Skills 來源與候選更新"
          add-paths: |
            content
            src/data/upstream.json
            src/data/discovery.json
            src/data/updates.json
          body-path: content/sync-report.md

      - name: Fail workflow when refresh or validation failed
        if: always() && (steps.refresh.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: exit 1
